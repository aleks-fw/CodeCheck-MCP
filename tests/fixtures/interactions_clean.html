<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Рабочие кнопки</title>

<body>
<h1>Рабочие элементы</h1>
<button id="ok" onclick="this.textContent='Готово'">Нажми</button>
<button disabled onclick="document.title='bad'">Отключена</button>
<a href="#target">К разделу</a>
<a href="#top">Наверх</a>
<form action="/nowhere">
  <input name="q" required aria-label="Запрос">
  <button type="submit">Отправить</button>
</form>
<div style="height:1200px"></div>
<h2 id="target">Раздел</h2>
</body></html>
