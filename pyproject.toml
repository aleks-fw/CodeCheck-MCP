[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecheck-mcp"
version = "0.2.1"
description = "MCP server that audits a finished web project in a real browser and writes a report an AI can fix code from"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0",
    "playwright>=1.50",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
codecheck-mcp = "codecheck_mcp.server:main"

[project.urls]
Homepage = "https://github.com/aleks-fw/CodeCheck-MCP"

[tool.setuptools.packages.find]
include = ["codecheck_mcp*"]

[tool.setuptools.package-data]
codecheck_mcp = ["vendor/*"]

[tool.ruff]
line-length = 135
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
